<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send a pic</title>
<body style="font-family:sans-serif;max-width:480px;margin:2rem auto;padding:1rem">
<h2>Send an image</h2>
<p><input type="password" id="tok" placeholder="Access token"></p>
<p><input type="file" id="f" accept="image/*"></p>
<button id="go">Upload</button>
<p id="msg"></p>
<script>
const OWNER="puglordthree", REPO="jennypic", PATH="latest.jpg";
const tok=document.getElementById('tok'), msg=document.getElementById('msg');
tok.value=localStorage.getItem('tok')||'';
document.getElementById('go').onclick=async()=>{
  try{
    const file=document.getElementById('f').files[0];
    if(!file) return msg.textContent='Pick an image first';
    localStorage.setItem('tok',tok.value);
    msg.textContent='Uploading...';
    const bmp=await createImageBitmap(file);
    const s=Math.min(1,2560/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');
    c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b64=c.toDataURL('image/jpeg',0.9).split(',')[1];
    const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
    const h={Authorization:'Bearer '+tok.value,Accept:'application/vnd.github+json'};
    let sha; const r=await fetch(url,{headers:h});
    if(r.ok) sha=(await r.json()).sha;
    const put=await fetch(url,{method:'PUT',headers:h,
      body:JSON.stringify({message:'new image',content:b64,sha})});
    msg.textContent=put.ok?'Sent!':'Failed: '+put.status;
  }catch(e){msg.textContent='Error: '+e.message}
};
</script>
